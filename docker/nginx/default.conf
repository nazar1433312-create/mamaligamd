server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 12M;

    # Keep the image's normal stdout logging (`docker compose logs web`), and
    # additionally log to a plain file whose mtime idlegate polls to know
    # when the site was last actually used — see docker/idlegate/main.go.
    access_log /var/log/nginx/access.log;
    access_log /var/run/idle/heartbeat.log;

    # If the app container is asleep, fastcgi_pass below fails to connect and
    # nginx returns 502/503/504 — send those to idlegate instead of a raw
    # error page. idlegate kicks off `docker start app` and returns a
    # "waking up" page that retries itself a few seconds later.
    error_page 502 503 504 = @waiting;

    location @waiting {
        proxy_pass http://idlegate:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_read_timeout 60;
        fastcgi_connect_timeout 3s;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|woff2?|ttf|ico)$ {
        # Serve the file directly if it physically exists (built assets, images);
        # otherwise fall through to PHP — needed for dynamic routes that happen
        # to end in .js/.css, like Livewire's /livewire/livewire.min.js.
        try_files $uri /index.php?$query_string;
        expires 7d;
        access_log off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
