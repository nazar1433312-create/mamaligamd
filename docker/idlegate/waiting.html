<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="3">
<title>MamaligaMD — загрузка</title>
<style>
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f9fafb;color:#111827;}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .spinner{width:40px;height:40px;border:4px solid #e0e7ff;border-top-color:#4f46e5;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:20px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  h1{font-size:18px;font-weight:600;margin:0 0 8px;}
  p{font-size:14px;color:#6b7280;margin:0;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <h1>Сайт просыпается…</h1>
    <p>Обычно это занимает несколько секунд. Страница обновится автоматически.</p>
  </div>
  <script>setTimeout(function(){ location.reload(); }, 3000);</script>
</body>
</html>
