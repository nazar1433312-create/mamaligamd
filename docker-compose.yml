services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:80"
    mem_limit: 64m
    cpus: 0.08

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    mem_limit: 1300m
    cpus: 0.50

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: php artisan queue:work --sleep=2 --tries=3 --max-time=3600
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    mem_limit: 400m
    cpus: 0.15

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    mem_limit: 96m
    cpus: 0.04

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 900m
    cpus: 0.15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redisdata:/data
    mem_limit: 150m
    cpus: 0.05

volumes:
  pgdata:
  redisdata:
