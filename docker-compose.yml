services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
      - idlegate
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - idle_heartbeat:/var/run/idle
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:80"
    mem_limit: 48m
    cpus: 0.06

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    mem_limit: 1300m
    cpus: 0.50

  # Lets `app` (nginx+PHP-FPM's actual backend) fully stop after 10 minutes
  # with no site/bot traffic, and starts it again on the next request —
  # frees ~1.3GB for the other projects sharing this VPS while the site is
  # idle. The only thing with access to docker.sock; everything else is
  # unprivileged. See docker/idlegate/main.go.
  idlegate:
    build:
      context: ./docker/idlegate
    restart: unless-stopped
    environment:
      SERVICE_LABEL: com.docker.compose.service=app
      HEARTBEAT_PATH: /var/run/idle/heartbeat.log
      IDLE_TIMEOUT: 10m
      CHECK_INTERVAL: 30s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - idle_heartbeat:/var/run/idle
    mem_limit: 24m
    cpus: 0.03

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: php artisan queue:work --sleep=2 --tries=3 --max-time=3600
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    mem_limit: 350m
    cpus: 0.12

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    mem_limit: 64m
    cpus: 0.02

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 900m
    cpus: 0.15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redisdata:/data
    mem_limit: 150m
    cpus: 0.05

  # TURN relay for WebRTC calls, used only when two browsers can't reach each
  # other directly (strict NAT / corporate firewall). Nothing is recorded or
  # written to disk — audio is relayed live and discarded.
  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    network_mode: host
    command: >
      turnserver
      --listening-port=3478
      --fingerprint
      --lt-cred-mech
      --user=${TURN_USERNAME:-mamaliga}:${TURN_PASSWORD:-change_me}
      --realm=${TURN_REALM:-mamaligamd.duckdns.org}
      --min-port=49160
      --max-port=49200
      --no-cli
      --no-tls
      --no-dtls
      --log-file=stdout
      --simple-log
    mem_limit: 80m
    cpus: 0.06

volumes:
  pgdata:
  redisdata:
  idle_heartbeat:
